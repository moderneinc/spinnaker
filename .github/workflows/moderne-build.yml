name: Build and Upload

on:
  workflow_dispatch:
    inputs:
      clouddriver:
        description: 'Build Clouddriver'
        type: boolean
        default: true
      deck:
        description: 'Build Deck'
        type: boolean
        default: true
      echo:
        description: 'Build Echo'
        type: boolean
        default: true
      front50:
        description: 'Build Front50'
        type: boolean
        default: true
      gate:
        description: 'Build Gate'
        type: boolean
        default: true
      igor:
        description: 'Build Igor'
        type: boolean
        default: true
      orca:
        description: 'Build Orca'
        type: boolean
        default: true
      rosco:
        description: 'Build Rosco'
        type: boolean
        default: true
  push:
    branches:
      - main

jobs:
  build-and-upload:
    name: Build and Upload ${{ matrix.project }}
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (matrix.project == 'clouddriver' && inputs.clouddriver != 'false') ||
      (matrix.project == 'echo'        && inputs.echo        != 'false') ||
      (matrix.project == 'front50'     && inputs.front50     != 'false') ||
      (matrix.project == 'gate'        && inputs.gate        != 'false') ||
      (matrix.project == 'igor'        && inputs.igor        != 'false') ||
      (matrix.project == 'orca'        && inputs.orca        != 'false') ||
      (matrix.project == 'rosco'       && inputs.rosco       != 'false')
    strategy:
      fail-fast: false
      matrix:
        project: [clouddriver, echo, front50, gate, igor, orca, rosco]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build Distribution
        uses: ./.github/actions/moderne/build-distribution
        with:
          project: ${{ matrix.project }}

      - name: Tar Distribution
        uses: ./.github/actions/moderne/tar-distribution
        with:
          project: ${{ matrix.project }}

      - name: Publish Tarball to S3
        uses: ./.github/actions/moderne/publish-s3-bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          project: ${{ matrix.project }}

  build-and-upload-deck:
    name: Build and Upload Deck
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.deck != 'false'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build Deck Distribution
        uses: ./.github/actions/moderne/build-deck-distribution

      - name: Tar Distribution
        uses: ./.github/actions/moderne/tar-distribution
        with:
          project: deck
          distribution-path: deck/build/webpack

      - name: Publish Tarball to S3
        uses: ./.github/actions/moderne/publish-s3-bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          project: deck
