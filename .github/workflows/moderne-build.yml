name: Build and Upload

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build and Upload ${{ matrix.project }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [clouddriver, echo, front50, gate, igor, orca, rosco]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build Distribution
        uses: ./.github/actions/moderne/build-distribution
        with:
          project: ${{ matrix.project }}

      - name: Tar Distribution
        uses: ./.github/actions/moderne/tar-distribution
        with:
          project: ${{ matrix.project }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::297794628946:role/github-publish-spinnaker
          aws-region: us-west-2

      - name: Publish Tarball to S3
        uses: ./.github/actions/moderne/publish-s3-bucket
        with:
          project: ${{ matrix.project }}

  build-and-upload-deck:
    name: Build and Upload Deck
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build Deck Distribution
        uses: ./.github/actions/moderne/build-deck-distribution

      - name: Tar Distribution
        uses: ./.github/actions/moderne/tar-distribution
        with:
          project: deck
          distribution-path: deck/build/webpack

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::297794628946:role/github-publish-spinnaker
          aws-region: us-west-2

      - name: Publish Tarball to S3
        uses: ./.github/actions/moderne/publish-s3-bucket
        with:
          project: deck
